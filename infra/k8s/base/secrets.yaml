# ---------------------------------------------------------------------------
# TEMPLATE ONLY. Do not commit real secret values to git.
#
# In a real deployment, replace this file with one of:
#   - External Secrets Operator syncing from AWS Secrets Manager / SSM
#   - Sealed Secrets (bitnami-labs/sealed-secrets), committing only the
#     encrypted SealedSecret resource
#   - `kubectl create secret generic ... --from-literal=...` applied out of
#     band by your deploy pipeline, never checked into version control
#
# This manifest exists so `kubectl apply -k` has something to reference and
# so the required keys are documented in one place.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: support-saas-secrets
  namespace: support-saas
type: Opaque
stringData:
  DATABASE_URL: "postgresql://CHANGE_ME:CHANGE_ME@postgres:5432/support_saas"
  MONGO_URL: "mongodb://CHANGE_ME:CHANGE_ME@mongodb:27017/support_saas_docs?authSource=admin"
  REDIS_URL: "redis://:CHANGE_ME@redis:6379"
  # Every secret below must be different and random (e.g. `openssl rand -hex 32`).
  # The API refuses to start in production with placeholders, duplicates or the built-in defaults.
  JWT_ACCESS_SECRET: "CHANGE_ME_ACCESS"
  JWT_REFRESH_SECRET: "CHANGE_ME_REFRESH"
  WIDGET_JWT_SECRET: "CHANGE_ME_WIDGET"
  SECURITY_HASH_SECRET: "CHANGE_ME_HASH"
  AI_SERVICE_TOKEN: "CHANGE_ME_AI_TOKEN" # shared by the api and ai-service, min 24 chars
  ENCRYPTION_KEY: "CHANGE_ME_BASE64_32_BYTES" # openssl rand -base64 32
  SMTP_USER: "CHANGE_ME"
  SMTP_PASS: "CHANGE_ME"
  GOOGLE_API_KEY: "CHANGE_ME"
  # Billing is optional; leave these empty to run on the Free plan limits.
  # Chat file storage (optional; empty = local disk). Set all three together.
  CLOUDINARY_CLOUD_NAME: ""
  CLOUDINARY_API_KEY: ""
  CLOUDINARY_API_SECRET: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_PRICE_STARTER: ""
  STRIPE_PRICE_GROWTH: ""
  STRIPE_PRICE_ENTERPRISE: ""
  STRIPE_PRICE_OVERAGE_STARTER: ""
  STRIPE_PRICE_OVERAGE_GROWTH: ""
  STRIPE_PRICE_OVERAGE_ENTERPRISE: ""
  STRIPE_COUPON_INTRO: ""
  STRIPE_TAX_RATE_IDS: ""
